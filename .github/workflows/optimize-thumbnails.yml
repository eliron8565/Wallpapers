name: Optimize SFW wallpaper thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - "data/wallpapers.json"
      - "scripts/create-thumbnails.py"
      - ".github/workflows/optimize-thumbnails.yml"

permissions:
  contents: write

concurrency:
  group: animewallora-thumbnail-optimization
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimization dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Build previews without touching original downloads
        run: python -u scripts/create-thumbnails.py
      - name: Validate and commit catalog
        run: |
          python scripts/validate-catalog.py
          if ! git diff --quiet -- data/wallpapers.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/wallpapers.json
            git commit -m "Generate responsive SFW artwork previews in R2"
            git pull --rebase origin main
            git push
          fi
