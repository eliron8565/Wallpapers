name: Validate wallpaper catalog
on:
  push:
    paths:
      - "data/wallpapers.json"
      - "scripts/validate-catalog.py"
  pull_request:
    paths:
      - "data/wallpapers.json"
      - "scripts/validate-catalog.py"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-catalog.py
