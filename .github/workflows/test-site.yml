name: Website smoke tests

on:
  push:
    paths:
      - "index.html"
      - "animewallora.js"
      - "animewallora.css"
      - "data/anime-gifs.json"
      - "data/wallpapers.json"
      - "scripts/validate-catalog.py"
      - ".github/workflows/test-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check front-end JavaScript syntax
        run: node --check animewallora.js
      - name: Validate licensed hosting catalog
        run: python3 scripts/validate-catalog.py
      - name: Validate anime-only GIF catalog and HTML
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf8")
          app = Path("animewallora.js").read_text(encoding="utf8")
          assert 'lang="en"' in html
          assert 'class="anime-gallery"' in html
          for name in ("animewallora.css", "animewallora.js"):
              assert name in html and Path(name).is_file(), name
          assert "data/anime-gifs.json" in app
          assert "SFW" in html, "SFW-only policy must be displayed"
          assert 'data-filter="images"' in html and 'data-filter="gifs"' in html, "GIF and image tabs are required"
          assert "qQC8JPGoSvNWZ4GI26" not in html, "Untrusted meme-prone hero removed"
          items = json.loads(Path("data/anime-gifs.json").read_text(encoding="utf8"))
          assert len(items) >= 40, "Expected at least 40 carefully selected SFW GIPHY embeds"
          ids = set()
          required = {"Jujutsu Kaisen", "Demon Slayer", "Naruto", "Bleach", "One Piece"}
          for item in items:
              assert item.get("type") == "giphy"
              assert item.get("giphyId") and re.fullmatch(r"[A-Za-z0-9]{12,32}", item["giphyId"])
              assert item["giphyId"] not in ids, "Duplicate GIPHY embed ID"
              ids.add(item["giphyId"])
              assert item.get("source") == "https://giphy.com/gifs/" + item["giphyId"]
              for key in ("title", "creator", "series", "character"):
                  assert item.get(key), f"Missing {key}"
          assert required <= {x["series"] for x in items}
          assert not any(x["giphyId"] == "a5bBoYG5GpnypTmwES" for x in items), "Reported meme must not reappear"
          assert all(x.get("creator") and x.get("source", "").startswith("https://giphy.com/gifs/") for x in items)
          images = json.loads(Path("data/wallpapers.json").read_text(encoding="utf8"))
          assert len(images) >= 60, "Expected 60+ curated licensed SFW artworks"
          assert any(x.get("series") == "Jujutsu Kaisen" for x in images)
          assert any(x.get("series") == "Naruto" for x in images)
          assert all(x.get("contentRating") == "sfw" for x in items + images), "Non-SFW or unreviewed media not allowed"
          assert "safeForWork(x)" in app, "Client-side SFW filtering is required"
          assert all(x.get("series") != "Chainsaw Man" for x in items), "Mature-rated series cannot appear in the SFW GIF feed"
          print(f"AnimeWallora passes: {len(items)} curated GIF embeds, {len(images)} artworks.")
          PY
